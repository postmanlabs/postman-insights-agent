# Use the latest 2.1 version of CircleCI pipeline process engine. See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# Job graph
# ---------
#   build       — long-running Go build + unit tests (original; ~5 min)
#   java-agent  - Java agent jar + its unit and -javaagent tests, on JDK 8, 21 and 25
jobs:
  build:
    working_directory: ~/repo
    docker:
      - image: cimg/go:1.25.11
    steps:
      - checkout
      - run:
          name: Check licence headers
          command: build-scripts/check-license-headers.sh
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}
      - run:
          name: Install Dependencies
          command: go mod download
      - run:
          name: Install pcap and eBPF toolchain
          command: |
            sudo apt-get update -y
            sudo apt-get install -y libpcap-dev clang llvm libbpf-dev linux-tools-common
            # On Ubuntu 24.04 (Noble), bpftool is not a standalone package — it lives in
            # linux-tools-<kernel-version>. Install that, then symlink to a stable PATH location.
            sudo apt-get install -y linux-tools-$(uname -r) 2>/dev/null \
              || sudo apt-get install -y linux-tools-generic
            BPFTOOL=$(find /usr/lib/linux-tools -name bpftool 2>/dev/null | head -1)
            [ -n "$BPFTOOL" ] && sudo ln -sf "$BPFTOOL" /usr/local/bin/bpftool
            bpftool version
      - run:
          name: Install mockgen and bpf2go
          command: |
            go install github.com/golang/mock/mockgen@v1.5.0
            go install github.com/cilium/ebpf/cmd/bpf2go@v0.18.0
      - run:
          name: Generate vmlinux.h from CI host kernel BTF
          command: |
            bpftool btf dump file /sys/kernel/btf/vmlinux format c > ebpf/programs/vmlinux.h
      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
      - run:
          name: Build CLI
          command: |
            make
      - run:
          name: Run tests
          command: |
            make mock
            mkdir -p /tmp/test-reports
            gotestsum --junitfile /tmp/test-reports/unit-tests.xml
      - store_test_results:
          path: /tmp/test-reports

  java-agent:
    parameters:
      test-jdk:
        description: >
          The JDK the -javaagent tests run on: 21 runs Gradle too; 8 and 25,
          the oldest and newest the agent supports, are downloaded (Temurin,
          pinned by checksum).
        type: enum
        enum: ["8", "21", "25"]
    working_directory: ~/repo
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "java-agent/build.gradle.kts" }}-{{ checksum "java-agent/gradle/wrapper/gradle-wrapper.properties" }}
      - run:
          name: Install the test JDK
          command: |
            case "<< parameters.test-jdk >>" in
              21) exit 0 ;;
              8)
                url=https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u504-b01/OpenJDK8U-jdk_x64_linux_hotspot_8u504b01.tar.gz
                sha256=9c70e102f527ac674ac2fe9c7d47b9a04e2d19842ba5ab8e9b33f368bbadfaea ;;
              25)
                url=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
                sha256=68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb ;;
            esac
            curl -fsSL -o /tmp/test-jdk.tar.gz "$url"
            echo "$sha256  /tmp/test-jdk.tar.gz" | sha256sum -c -
            mkdir -p /tmp/test-jdk
            tar -xzf /tmp/test-jdk.tar.gz -C /tmp/test-jdk --strip-components=1
            /tmp/test-jdk/bin/java -version
      - run:
          name: Build and test the Java agent
          command: |
            cd java-agent
            if [ "<< parameters.test-jdk >>" = 21 ]; then
              ./gradlew --no-daemon check agentJar
            else
              ./gradlew --no-daemon -PagentTestJavaHome=/tmp/test-jdk check agentJar
            fi
      - save_cache:
          key: gradle-v1-{{ checksum "java-agent/build.gradle.kts" }}-{{ checksum "java-agent/gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle
      - store_test_results:
          path: java-agent/build/test-results
      - store_artifacts:
          path: java-agent/build/agent/postman-insights-java-agent.jar

workflows:
  ci:
    jobs:
      - build
      - java-agent:
          name: java-agent-jdk<< matrix.test-jdk >>
          matrix:
            parameters:
              test-jdk: ["21", "8", "25"]
