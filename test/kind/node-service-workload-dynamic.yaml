# Node.js HTTPS (:8443) and gRPC-TLS (:8446) service on the image's shared
# libssl (test/kind/Dockerfile.node-service-dynamic), captured by the libssl
# uprobes. Deployed by deploy-node-service.sh (the default variant).
# A Deployment, not a bare Pod: in discovery mode the Insights agent captures
# only pods of long-running controllers and skips standalone pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service
  namespace: test-apps
  labels:
    app: node-service
spec:
  replicas: 1
  # The old pod is gone before the new one starts, so the deploy script sees
  # one pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-service
  template:
    metadata:
      labels:
        app: node-service
    spec:
      containers:
      - name: app
        image: pia-node-service:test
        imagePullPolicy: Never
        command: ["node", "server.js"]
        ports:
        - containerPort: 8443
        - containerPort: 8446
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tls
        configMap:
          name: test-apps-tls
