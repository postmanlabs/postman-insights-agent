# The same Spring Boot (Tomcat) HTTPS service, started without the Postman
# Insights Java agent: the Insights agent attaches it to the running JVM.
# Image: test/kind/Dockerfile.java-service. Deployed by deploy-java-service.sh.
# A Deployment, not a bare Pod: in discovery mode the Insights agent captures
# only pods of long-running controllers and skips standalone pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-service-attach
  namespace: test-apps
  labels:
    app: java-service-attach
spec:
  replicas: 1
  # The old pod is gone before the new one starts, so the deploy script sees
  # one pod per service.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: java-service-attach
  template:
    metadata:
      labels:
        app: java-service-attach
    spec:
      containers:
      - name: java-service-attach
        image: pia-java-service:test
        imagePullPolicy: Never
        # The image's entrypoint without -javaagent.
        command: ["java", "-jar", "/app/app.jar"]
        ports:
        - containerPort: 8443
          name: https
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        # TCP, not HTTPS: an HTTPS probe would itself be captured and count
        # towards the checks in deploy-java-service.sh.
        readinessProbe:
          tcpSocket: { port: 8443 }
          initialDelaySeconds: 5
          periodSeconds: 5
