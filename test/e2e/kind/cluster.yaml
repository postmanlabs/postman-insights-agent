# Single-node kind cluster for the HTTPS capture end-to-end scripts
# (test/e2e/deploy-*-service.sh), created by lib.sh when it is missing.
# The agent DaemonSet mounts the kind node's own /proc, as on a real cluster
# (see agent-daemonset-prod.yaml, volume host-proc), so no extra mounts are
# needed here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pia-https-test
nodes:
- role: control-plane
