# ASP.NET Core HTTPS (:8443) and gRPC-TLS (:8446) service on the system's
# OpenSSL, captured by the libssl uprobes; it models a customer's ASP.NET Core
# service with a self-signed certificate. Its /phase5b2/call-external calls
# node-service over HTTPS. Deployed by deploy-dotnet-service.sh.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-service
  namespace: test-apps
  labels:
    app: dotnet-service
spec:
  replicas: 1
  # The old pod is gone before the new one starts, so the deploy script sees
  # one pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dotnet-service
  template:
    metadata:
      labels:
        app: dotnet-service
    spec:
      containers:
      - name: app
        image: pia-dotnet-service:test
        imagePullPolicy: Never
        command: ["sh", "-c"]
        args: ["dotnet DotnetService.dll"]
        env:
        - name: EXTERNAL_HTTPS_BASE
          value: "https://node-service:8443"
        ports:
        - containerPort: 8443
        - containerPort: 8446
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tls
        configMap:
          name: test-apps-tls
